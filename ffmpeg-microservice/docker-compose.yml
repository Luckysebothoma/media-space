services:

  db:
    image: postgres:16-alpine
    container_name: ffmpeg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ffmpeg_db
      POSTGRES_USER:     ffmpeg
      POSTGRES_PASSWORD: ffmpeg_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffmpeg -d ffmpeg_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5442:5432"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ffmpeg_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:        3000
      PGHOST:      db
      PGPORT:      5432
      PGDATABASE:  ffmpeg_db
      PGUSER:      ffmpeg
      PGPASSWORD:  ffmpeg_pass
      DATA_ROOT:   /data/media
      OUTPUT_BASE: /data/archives
      LOG_DIR:     /data/logs
    volumes:
      - /mnt/blue_442gb/comfyui:/data/media
      - /mnt/blue_442gb/proccessed/comfyui/generated_i2v/mlavish:/data/archives
      - shared_logs:/data/logs
    ports:
      - "3110:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  shared_media:
  shared_archives:
  shared_logs:
